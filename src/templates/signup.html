{% extends "base.html" %}

{% block title %}
Sign Up - ReleCloud
{% endblock %}

{% block content %}
<h1 class="display-4 tk-elevon">Sign Up</h1>
<p class="lead">Create an account to request information about our space cruises.</p>

{% if error %}
<div class="alert alert-danger" role="alert">
    {{ error }}
</div>
{% endif %}

<form method="post" action="{{ url_for('signup') }}">
    <div class="form-group mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" required>
    </div>
    
    <div class="form-group mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
    </div>
    
    <div class="form-group mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
    </div>
    
    <button type="submit" class="btn btn-primary">Sign Up</button>
    <a href="{{ url_for('login_form') }}" class="btn btn-secondary">Already have an account? Log In</a>
</form>
{% endblock %}
